id: no-scaffold-leftovers
language: Tsx
severity: error
message: "create-next-app boilerplate. Replace with real product metadata/fonts."
rule:
  any:
    - kind: string
    - kind: jsx_text
    - kind: identifier
  regex: "(?i)create next app|generated by create next app|\\bgeist\\b|vercel\\.svg|next\\.svg"
files: ["src/**"]
