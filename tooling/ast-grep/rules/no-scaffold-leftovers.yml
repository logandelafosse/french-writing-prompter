id: no-scaffold-leftovers
language: Tsx
severity: error
message: "create-next-app boilerplate. Replace with real product metadata/fonts."
rule:
  any:
    - kind: string
    - kind: jsx_text
    - kind: identifier
    - kind: template_string
    - kind: comment
  regex: "(?i)create next app|generated by create next app|geist|font-geist|vercel\\.svg|next\\.svg"
files: ["src/**"]
