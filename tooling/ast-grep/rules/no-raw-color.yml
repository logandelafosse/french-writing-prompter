id: no-raw-color
language: Tsx
severity: error
message: "No raw colors in TS/TSX. Use token classes from src/styles/tokens.css."
rule:
  any:
    - kind: string
    - kind: template_string
  regex: '#[0-9a-fA-F]{3,8}\b|\b(rgba?|hsla?|oklch)\('
files: ["src/**"]
ignores: ["src/components/legacy/**", "src/test/lint-fixtures/**"]
