name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: "0"
    outputs:
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - name: Detect docs-only push
        id: docs-only
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: npx tsx tooling/ci/docs-only-cli.ts --github-output
      - run: npm run check
      - run: npm run build

      - name: Production line budget
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'size-exempt')
        run: npm run pr:size

  e2e:
    needs: check
    if: ${{ needs.check.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
