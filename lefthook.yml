pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,css,md,json,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{ts,tsx}"
      run: npx eslint --max-warnings=0 {staged_files}
    ast-grep:
      glob: "*.{ts,tsx,css}"
      run: npx ast-grep scan {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit --incremental false

pre-push:
  commands:
    check:
      skip:
        - run: npx tsx tooling/ci/docs-only-cli.ts --skip-push
      # GIT_DIR from the hook would make nested git tests operate on this repo.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_PREFIX npm run check
